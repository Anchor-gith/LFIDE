<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFIDE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
<style>
:root{--bg:#e9f0f6;--ink:#13233b;--mute:#5a6b82;--card:#fff;--line:#c9d6e3;--acc:#2a56f0;--gold:#f2b705;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--ink:#eaf0f8;--mute:#9aaac0;--card:#172640;--line:#2a3d5c;--acc:#6f8fff;--accink:#0f1a2b}}
:root[data-theme="dark"]{--bg:#0f1a2b;--ink:#eaf0f8;--mute:#9aaac0;--card:#172640;--line:#2a3d5c;--acc:#6f8fff;--accink:#0f1a2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:56px 20px 64px}
h1{font-size:clamp(4rem,19vw,8rem);font-weight:800;letter-spacing:-.04em;line-height:.9;margin:0}
.sub{color:var(--mute);margin:14px 0 28px;font-size:1.1rem}
.btn{display:inline-block;background:var(--acc);color:var(--accink);font-weight:700;text-decoration:none;padding:14px 24px;border-radius:999px;font-size:1rem}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h2{font-size:1.5rem;margin:56px 0 14px}
ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
li{display:flex;align-items:baseline;gap:18px;padding:14px 4px;border-bottom:1px solid var(--line)}
.n{font-weight:800;font-size:1.6rem;width:2.2ch;color:var(--mute);font-variant-numeric:tabular-nums}
.p{font-size:1.2rem;font-weight:600}
li:nth-child(1){padding:22px 4px}
li:nth-child(1) .n{color:var(--gold)}
li:nth-child(1) .p{font-size:2rem;font-weight:800}
li:nth-child(2) .p,li:nth-child(3) .p{font-size:1.4rem;font-weight:700}
</style>
</head>
<body>
<main>
<h1>LFIDE</h1>
<p class="sub">Current rankings and league rules.</p>
<a class="btn" href="https://docs.google.com/document/d/1HzTxL0eb090Ic19-g5DNzUJjz0i0eQMYZOhuLdXq4Hk/edit?tab=t.0" target="_blank" rel="noopener">Rules and Regulations</a>
<h2>Rankings</h2>
<ol>
<li><span class="n">1</span><span class="p">Latte</span></li>
<li><span class="n">2</span><span class="p">Aaron</span></li>
<li><span class="n">3</span><span class="p">Anakin</span></li>
<li><span class="n">4</span><span class="p">Ray</span></li>
<li><span class="n">5</span><span class="p">Narvy</span></li>
<li><span class="n">6</span><span class="p">Kato</span></li>
<li><span class="n">7</span><span class="p">Jin</span></li>
<li><span class="n">8</span><span class="p">Mike</span></li>
<li><span class="n">9</span><span class="p">Taro</span></li>
</ol>
</main>
</body>
</html>
