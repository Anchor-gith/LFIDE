<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LFIDE</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&display=swap">
<style id="css">
:root{--bg:#e9f0f6;--ink:#13233b;--mute:#5a6b82;--card:#fff;--line:#c9d6e3;--acc:#2a56f0;--gold:#f2b705;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a2b;--ink:#eaf0f8;--mute:#9aaac0;--card:#172640;--line:#2a3d5c;--acc:#6f8fff;--accink:#0f1a2b}}
:root[data-theme="dark"]{--bg:#0f1a2b;--ink:#eaf0f8;--mute:#9aaac0;--card:#172640;--line:#2a3d5c;--acc:#6f8fff;--accink:#0f1a2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:56px 20px 64px}
h1{font-size:clamp(4rem,19vw,8rem);font-weight:800;letter-spacing:-.04em;line-height:.9;margin:0}
.sub{color:var(--mute);margin:14px 0 28px;font-size:1.1rem}
.btn,button{font:inherit;cursor:pointer;border:0;background:var(--acc);color:var(--accink);font-weight:700;text-decoration:none;display:inline-block;padding:12px 22px;border-radius:999px}
button.s{padding:6px 12px;font-size:.85rem;background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.g{background:none;color:var(--mute);padding:0;font-weight:400;text-decoration:underline}
.btn:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
h2{font-size:1.5rem;margin:48px 0 6px}
.leg{color:var(--mute);font-size:.9rem;margin:0 0 14px}
ol{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
li{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.n{font-weight:800;font-size:1.6rem;width:2.2ch;color:var(--mute);font-variant-numeric:tabular-nums}
.p{font-size:1.2rem;font-weight:600;flex:1}
.pt{font-weight:800;font-size:1.2rem;font-variant-numeric:tabular-nums}
.pt small{font-weight:400;color:var(--mute);font-size:.75rem}
.rec{color:var(--mute);font-size:.8rem;width:100%;padding-left:calc(2.2ch + 14px)}
li.r1{padding:22px 4px}li.r1 .n{color:var(--gold)}li.r1 .p{font-size:2rem;font-weight:800}
li.r2 .p,li.r3 .p{font-size:1.4rem;font-weight:700}
.acts{display:flex;gap:6px}
input{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:180px;max-width:100%}
.foot{margin-top:40px}.msg{color:var(--mute);margin:12px 0}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0}
.crown{display:inline-block;font-size:.55em;font-weight:800;letter-spacing:.06em;background:var(--gold);color:#13233b;padding:2px 10px;border-radius:999px;vertical-align:middle;margin-left:6px}
.rin{width:90px;padding:6px 10px;font-size:.85rem}
input,select{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.ev{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.evt{font-size:1.25rem;margin-left:8px}
.tag{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--mute)}
.dt{color:var(--mute);margin:4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-weight:600}
.chip.won{border-color:var(--gold);background:rgba(242,183,5,.18)}
.chip.lost{opacity:.65}
.chip button.s{padding:2px 8px;font-size:.75rem}
.sum{margin:8px 0 0;font-size:.95rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.sec{color:var(--mute);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:28px 0 10px}
.logo{margin:0 0 6px;line-height:0}
.logo img{width:min(230px,62%);height:auto;display:block;mix-blend-mode:multiply}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo img{filter:invert(1);mix-blend-mode:screen}}
:root[data-theme="dark"] .logo img{filter:invert(1);mix-blend-mode:screen}
.acts{flex-wrap:wrap}
</style>
</head>

 S.months=1;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}

function ranked(){return S.players.map((p,i)=>({p,i})).sort((a,b)=>pts(b.p)-pts(a.p)||b.p.w-a.p.w||a.i-b.i);}
const admin=()=>mode==='admin';
function fmt(d){try{return new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});}catch(e){return d;}}
function adminBar(){
 if(!admin())return '';
 return '<div class="bar">'+(page==='home'?'<button data-a="undo">Undo last</button>':'')+'<button class="s" data-a="exp">Export</button><button class="s" data-a="imp">Import</button><button class="g" data-a="exit">Exit admin</button></div><p class="msg">'+esc(note)+'</p>'+(box!==null?'<textarea id="box" rows="6" style="width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)">'+esc(box)+'</textarea>'+(boxMode==='imp'?'<div class="bar"><button data-a="load">Load pasted data</button></div>':''):'');
}
function homeHtml(){
 const rows=ranked().map(({p,i},k)=>{
  const gp=p.w+p.d+p.l;
  const wp=gp?Math.round(p.w/gp*100)+'% win':'';
  const rt=(p.rt===undefined||p.rt==='')?'':'Rating '+esc(p.rt);
  const rec=[gp?p.w+'W '+p.d+'D '+p.l+'L':'',wp,rt].filter(Boolean).join(' · ');
  return '<li class="r'+(k+1)+'"><span class="n">'+(k+1)+'</span><span class="p">'+esc(p.name)+(k===0?' <span class="crown">&#128081; LGM</span>':'')+'</span>'+
  (admin()?'<span class="acts"><button class="s" data-a="w" data-i="'+i+'">Win +5</button><button class="s" data-a="d" data-i="'+i+'">Draw +3</button><button class="s" data-a="l" data-i="'+i+'">Loss +1</button><input class="rin" type="number" step="any" placeholder="Rating" aria-label="Rating for '+esc(p.name)+'" data-rt="'+i+'" value="'+(p.rt===undefined?'':esc(p.rt))+'">'+(delC===i?'<button class="s" data-a="delp2" data-i="'+i+'">Confirm delete</button><button class="s" data-a="delx">Cancel</button>':'<button class="s" data-a="delp" data-i="'+i+'">Delete</button>')+'</span>':'')+
  '<span class="pt">'+pts(p)+' <small>pts</small></span>'+(rec?'<span class="rec">'+rec+'</span>':'')+'</li>';}).join('');
 return '<h2>'+(admin()?'Admin':'Rankings')+'</h2><p class="leg">Win = 5 pts · Draw = 3 pts · Loss = 1 pt</p>'+adminBar()+(admin()?'<div class="row" style="margin:0 0 16px"><input id="np" type="text" placeholder="New player name" maxlength="30" aria-label="New player name"><input class="rin" id="nw" type="number" min="0" placeholder="Wins" aria-label="Starting wins"><input class="rin" id="nd" type="number" min="0" placeholder="Draws" aria-label="Starting draws"><input class="rin" id="nl" type="number" min="0" placeholder="Losses" aria-label="Starting losses"><input class="rin" id="nr" type="number" step="any" placeholder="Rating" aria-label="Starting rating"><button data-a="addp">Add player</button></div>':'')+'<ol>'+rows+'</ol>';

function evCard(e){
 const r=e.r||{},done=Object.keys(r).length>0;
 let h='<div class="ev"><span class="tag">'+esc(e.k)+'</span><b class="evt">'+esc(e.t)+'</b><div class="dt">'+(e.d?fmt(e.d):'Date to be announced')+'</div>';
 if(admin())h+='<div class="row"><input type="text" value="'+esc(e.t)+'" data-et="'+e.id+'" aria-label="Event title"><input type="date" value="'+esc(e.d)+'" data-ed="'+e.id+'" aria-label="Event date"><button class="s" data-a="delev" data-e="'+e.id+'">Delete event</button></div>';
 h+='<div class="chips">'+(e.s.length?e.s.map(n=>{
  const x=r[n]||'';
  return '<span class="chip '+x+'">'+esc(n)+(x==='won'?' &#127942;':'')+(admin()?'<button class="s" data-a="won" data-e="'+e.id+'" data-n="'+esc(n)+'">Won</button><button class="s" data-a="lost" data-e="'+e.id+'" data-n="'+esc(n)+'">Lost</button><button class="s" data-a="rm" data-e="'+e.id+'" data-n="'+esc(n)+'" aria-label="Remove '+esc(n)+'">&times;</button>':(x==='lost'?' <small>lost</small>':''))+'</span>';}).join(''):'<span class="dt">No sign-ups yet.</span>')+'</div>';
 if(done){
  const w=e.s.filter(n=>r[n]==='won'),l=e.s.filter(n=>r[n]==='lost');
  h+='<p class="sum">'+(w.length?'<b>Won:</b> '+w.map(esc).join(', '):'')+(w.length&&l.length?' &nbsp;·&nbsp; ':'')+(l.length?'<b>Lost:</b> '+l.map(esc).join(', '):'')+'</p>';
 }else{
  const opts=S.players.filter(p=>!e.s.includes(p.name)).map(p=>'<option>'+esc(p.name)+'</option>').join('');
  h+=opts?'<div class="row"><select id="su-'+e.id+'" aria-label="Your name"><option value="">Choose your name</option>'+opts+'</select><button data-a="su" data-e="'+e.id+'">Sign up</button></div>':'<p class="dt">Everyone on the leaderboard has signed up.</p>';
 }
 return h+'</div>';
}
function calHtml(){
 const today=new Date().toISOString().slice(0,10);
 const isPast=e=>Object.keys(e.r||{}).length>0||(e.d&&e.d<today);
 const up=S.events.filter(e=>!isPast(e)).sort((a,b)=>(a.d||'9999').localeCompare(b.d||'9999'));

 let h='<h2>Calendar</h2><p class="leg">Sign up by choosing your name from the leaderboard.</p>'+adminBar();
 if(!admin()&&note)h+='<p class="msg">'+esc(note)+'</p>';

 h+='<div class="sec">Upcoming</div>'+(up.length?up.map(evCard).join(''):'<p class="dt">No upcoming events.</p>');

function act(a,d){

 if(a!=='delp')delC=-1;

 else if(a==='exp'){box=JSON.stringify(S);boxMode='exp';note='Copy this text to back up your standings and events.';}
 else if(a==='imp'){box='';boxMode='imp';note='Paste exported data below.';}
 else if(a==='load'){try{const o=JSON.parse(document.getElementById('box').value);if(!o||!Array.isArray(o.players))throw 0;S=o;if(!Array.isArray(S.events))S.events=[];if(!Array.isArray(S.log))S.log=[];save();box=null;}catch(e){note='That data is not valid.';}}
 else if(a==='addp'){const n=document.getElementById('np').value.trim();
  const g=id=>Math.max(0,parseInt(document.getElementById(id).value,10)||0);
  const rv=document.getElementById('nr').value.trim();
  if(!n)note='Enter a player name.';
  else if(S.players.some(p=>p.name.toLowerCase()===n.toLowerCase()))note=n+' is already on the leaderboard.';
  else{S.players.push({name:n,w:g('nw'),d:g('nd'),l:g('nl'),rt:rv===''?'':Number(rv)});save();note=n+' added.';}}
 else if(a==='delp'){delC=+d.i;}
 else if(a==='delx'){delC=-1;}
 else if(a==='delp2'){const i=+d.i,p=S.players[i];
  if(p){S.players.splice(i,1);
   S.log=S.log.filter(x=>x.i!==i).map(x=>({i:x.i>i?x.i-1:x.i,r:x.r}));
   S.events.forEach(e=>{e.s=e.s.filter(n=>n!==p.name);if(e.r)delete e.r[p.name];});
   save();note=p.name+' deleted.';}}
 else if(a==='su'){const sel=document.getElementById('su-'+d.e),n=sel&&sel.value;
  if(!n)note='Choose your name first.';
  else if(ev&&S.players.some(p=>p.name===n)&&!ev.s.includes(n)){ev.s.push(n);save();note=n+' is signed up!';}}
 else if(a==='rm'&&ev){ev.s=ev.s.filter(x=>x!==d.n);if(ev.r)delete ev.r[d.n];save();}
 else if((a==='won'||a==='lost')&&ev){ev.r=ev.r||{};if(ev.r[d.n]===a)delete ev.r[d.n];else ev.r[d.n]=a;save();}
 else if(a==='delev'){S.events=S.events.filter(x=>x.id!==d.e);save();}
 else if(a==='addev'){const t=document.getElementById('ne-t').value.trim();
  if(!t)note='Enter an event title.';
  else{S.events.push({id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:t,k:document.getElementById('ne-k').value,d:document.getElementById('ne-d').value,s:[],r:{}});save();}}
 render();
}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(b&&b.dataset.a)act(b.dataset.a,b.dataset);});
root.addEventListener('change',e=>{const t=e.target,d=t.dataset||{};
 if(d.rt!==undefined){const v=t.value.trim();S.players[+d.rt].rt=v===''?'':Number(v);save();}
 else if(d.ed){const ev=S.events.find(x=>x.id===d.ed);if(ev){ev.d=t.value;save();render();}}
 else if(d.et){const ev=S.events.find(x=>x.id===d.et);if(ev){ev.t=t.value.trim()||ev.t;save();}}
});
render();
</script>
</body>
</html>
